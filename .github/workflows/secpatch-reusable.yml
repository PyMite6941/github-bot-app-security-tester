name: SecPatch Bot - Reusable Workflow

on:
  workflow_call:
    inputs:
      severity:
        description: "Minimum severity to report"
        required: false
        type: string
        default: "high"
      test_cmd:
        description: "Test command to run after patching"
        required: false
        type: string
        default: "npm test"
      fail_on_findings:
        description: "Fail the workflow when findings are detected"
        required: false
        type: boolean
        default: false
    secrets:
      SECPATCH_AI_API_KEY:
        required: false
      SECPATCH_AI_BASE_URL:
        required: false
      SECPATCH_AI_MODEL:
        required: false

jobs:
  secpatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run SecPatch scan
        id: scan
        env:
          SECPATCH_AI_API_KEY: ${{ secrets.SECPATCH_AI_API_KEY }}
          SECPATCH_AI_BASE_URL: ${{ secrets.SECPATCH_AI_BASE_URL }}
          SECPATCH_AI_MODEL: ${{ secrets.SECPATCH_AI_MODEL }}
          SECPATCH_LOG_LEVEL: info
        run: |
          node src/cli.js scan . --severity ${{ inputs.severity }} --format json > secpatch-scan.json || true

      - name: Generate method-level tests
        run: |
          node src/cli.js test . --log-file secpatch.log --log-level info --timeout 180 || true

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secpatch-scan-results
          path: |
            secpatch.log
            secpatch-scan.json

      - name: Post PR comment with findings
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let findings = [];
            try {
              findings = JSON.parse(fs.readFileSync('secpatch-scan.json', 'utf8'));
            } catch (e) {
              core.warning('Could not parse secpatch-scan.json');
            }
            const critical = findings.filter(f => f.severity === 'critical');
            const high = findings.filter(f => f.severity === 'high');
            const body = [
              '## 🔒 SecPatch Bot Security Scan',
              '',
              `Found **${findings.length}** vulnerability(s): **${critical.length}** critical, **${high.length}** high.`,
              '',
              '| Severity | Rule | File | Line | Title |',
              '|----------|------|------|------|-------|',
            ].concat(
              findings.map(f =>
                `| ${f.severity} | \`${f.ruleId}\` | \`${f.file}\` | ${f.line} | ${f.title} |`
              )
            ).join('\n');
            body.push('');
            body.push('See workflow artifacts for full scan logs.');
            if (critical.length > 0) {
              body.push('');
              body.push('⚠️ Critical vulnerabilities detected — review draft patches in the artifacts.');
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body.join('\n'),
            });

      - name: Create issue on critical findings
        if: steps.scan.outputs.scan_complete == 'true' && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let findings = [];
            try {
              findings = JSON.parse(fs.readFileSync('secpatch-scan.json', 'utf8'));
            } catch (e) {}
            const critical = findings.filter(f => f.severity === 'critical');
            if (critical.length === 0) return;
            const titles = critical.map(f => `- \`${f.ruleId}\` in \`${f.file}\`:${f.line} — ${f.title}`).join('\n');
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 SecPatch Bot: ${critical.length} critical vulnerability(ies)`,
              body: `## Critical Vulnerabilities\n\n${titles}\n\nApply patches via \`secpatch orchestrate . --ai --test-cmd "${{ inputs.test_cmd }}"\`.`,
              labels: ['security', 'critical', 'secpatch-bot'],
            });
