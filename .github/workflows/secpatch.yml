name: SecPatch Bot - CI Scan

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  secpatch:
    uses: ./.github/workflows/secpatch-reusable.yml
    with:
      severity: high
      fail_on_findings: false
    secrets: inherit
