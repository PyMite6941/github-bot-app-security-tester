name: SecPatch Bot - Automated Vulnerability Patching

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "0 2 * * *"  # daily scan
  workflow_dispatch:
    inputs:
      mode:
        description: "Bot mode"
        required: true
        default: "report-only"
        type: choice
        options:
          - report-only
          - auto-apply

permissions:
  contents: read
  pull-requests: write
  issues: write
  security-events: write

jobs:
  secpatch-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run SecPatch bot scan
        id: scan
        env:
          SECPATCH_AI_API_KEY: ${{ secrets.SECPATCH_AI_API_KEY }}
          SECPATCH_AI_BASE_URL: ${{ secrets.SECPATCH_AI_BASE_URL }}
          SECPATCH_AI_MODEL: ${{ secrets.SECPATCH_AI_MODEL }}
          SECPATCH_LOG_LEVEL: info
        run: |
          node src/cli.js ci . --severity high --log-file secpatch.log --log-level info --format json > secpatch-scan.json || true
          echo "scan_complete=true" >> $GITHUB_OUTPUT

      - name: Generate method-level tests
        id: testgen
        env:
          SECPATCH_LOG_LEVEL: info
        run: |
          node src/cli.js test . --log-file secpatch.log --log-level info --timeout 180 || true

      - name: Draft and validate patches (AI)
        if: env.SECPATCH_AI_API_KEY != ''
        id: patch
        env:
          SECPATCH_AI_API_KEY: ${{ secrets.SECPATCH_AI_API_KEY }}
          SECPATCH_AI_BASE_URL: ${{ secrets.SECPATCH_AI_BASE_URL }}
          SECPATCH_AI_MODEL: ${{ secrets.SECPATCH_AI_MODEL }}
          SECPATCH_LOG_LEVEL: info
        run: |
          node src/cli.js patch . --ai --test-cmd "npm test" --draft-only --log-file secpatch.log --log-level info --format json > secpatch-patches.json || true

      - name: Upload SecPatch artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secpatch-bot-artifacts
          path: |
            secpatch.log
            secpatch-scan.json
            secpatch-patches.json
          retention-days: 7

      - name: Post PR comment with findings
        if: github.event_name == 'pull_request' && steps.scan.outputs.scan_complete == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let findings = [];
            try {
              findings = JSON.parse(fs.readFileSync('secpatch-scan.json', 'utf8'));
            } catch (e) {
              core.warning('Could not parse secpatch-scan.json');
            }
            const critical = findings.filter(f => f.severity === 'critical');
            const high = findings.filter(f => f.severity === 'high');
            const body = [
              '## 🔒 SecPatch Bot Security Scan',
              '',
              `Found **${findings.length}** vulnerability(s): **${critical.length}** critical, **${high.length}** high.`,
              '',
              '| Severity | Rule | File | Line | Title |',
              '|----------|------|------|------|-------|',
            ].concat(
              findings.map(f =>
                `| ${f.severity} | \`${f.ruleId}\` | \`${f.file}\` | ${f.line} | ${f.title} |`
              )
            ).join('\n');
            body.push('');
            body.push('See the **SecPatch bot artifacts** for full scan logs and draft patches.');
            if (critical.length > 0) {
              body.push('');
              body.push('⚠️ Critical vulnerabilities detected. Review and apply patches from the artifacts.');
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body.join('\n'),
            });

      - name: Create issue on critical findings
        if: steps.scan.outputs.scan_complete == 'true' && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let findings = [];
            try {
              findings = JSON.parse(fs.readFileSync('secpatch-scan.json', 'utf8'));
            } catch (e) {
              core.warning('Could not parse secpatch-scan.json');
            }
            const critical = findings.filter(f => f.severity === 'critical');
            if (critical.length === 0) return;
            const titles = critical.map(f => `- \`${f.ruleId}\` in \`${f.file}\`:${f.line} — ${f.title}`).join('\n');
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 SecPatch Bot: ${critical.length} critical vulnerability(ies) detected`,
              body: `## Critical Vulnerabilities Detected\n\n${titles}\n\nReview draft patches in the workflow artifacts and apply them via \`secpatch patch --ai --test-cmd "npm test"\`.`,
              labels: ['security', 'critical', 'secpatch-bot'],
            });
